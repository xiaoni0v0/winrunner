[tool.black]
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
platform = "win32"
check_untyped_defs = true
files = [
    "config.py",
    "gitrepo.py",
    "runner.py",
    "winfiles.py",
    "winprocess.py",
    "winrunner.py",
    "winrunner_desktop.py",
    "winrunner_files.py",
    "winrunner_gui.py",
    "winrunner_gui_files.py",
    "winrunner_gui_forms.py",
    "tests",
]
